# The FastAPI app (src/finrag/api.py). Stateless: the index is in Qdrant, the documents
# on the read-only corpus volume, so it scales by replicas.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finrag-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}  # never below 2 ready pods
  selector:
    matchLabels:
      app.kubernetes.io/name: finrag-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: finrag-api
        finrag/client-of-index: "true"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: api
          image: finrag
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef: {name: finrag-config}
            - secretRef: {name: finrag-secrets}
          volumeMounts:
            - name: corpus
              mountPath: /data
              readOnly: true
            - name: tmp
              mountPath: /tmp
          # Liveness never touches a dependency (/health): a slow Qdrant must not get
          # healthy pods restarted. Readiness (/ready) checks the index and the corpus:
          # an unready pod receives no traffic but keeps running.
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 2
            failureThreshold: 60
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 20
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
            timeoutSeconds: 3
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: [ALL]}
      volumes:
        - name: corpus
          persistentVolumeClaim:
            claimName: finrag-corpus
            readOnly: true
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: finrag-api
spec:
  selector:
    app.kubernetes.io/name: finrag-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
# A node drain or an upgrade keeps at least one API pod serving.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: finrag-api
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: finrag-api
