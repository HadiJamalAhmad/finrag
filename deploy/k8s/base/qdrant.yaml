# The vector index. A StatefulSet: a stable name (qdrant-0) and its own volume, which
# survives a restart or a reschedule, unlike a Deployment's pods.
# Server v1.20.0 matches the locked client (qdrant-client 1.20.0 in uv.lock).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: qdrant
spec:
  serviceName: qdrant
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: qdrant
  template:
    metadata:
      labels:
        app.kubernetes.io/name: qdrant
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: qdrant
          image: qdrant/qdrant:v1.20.0
          ports:
            - name: http
              containerPort: 6333
          env:
            - name: QDRANT__TELEMETRY_DISABLED
              value: "true"
            # The image writes snapshots to /qdrant/snapshots, owned by root; we run as
            # 1000 (seen on the first deploy: "Failed to create snapshots temp directory").
            # Keep them on the volume instead of giving the container root back.
            - name: QDRANT__STORAGE__SNAPSHOTS_PATH
              value: /qdrant/storage/snapshots
          volumeMounts:
            - name: storage
              mountPath: /qdrant/storage
          readinessProbe:
            httpGet: {path: /readyz, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /livez, port: http}
            periodSeconds: 20
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        resources:
          requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: qdrant
spec:
  selector:
    app.kubernetes.io/name: qdrant
  ports:
    - name: http
      port: 6333
      targetPort: http
