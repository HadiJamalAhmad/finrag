# Scale vLLM on its own load: requests waiting AND running, summed over the replicas.
# One replica serves 4 at a time (--max-num-seqs), so one replica per 4 requests, 1 to 3.
# Waiting alone was wrong: once the queue emptied, KEDA removed replicas that were still
# generating answers (8 requests lost in a CI run). See also the preStop drain in vllm.yaml.
apiVersion: keda.sh/v1alpha1
kind: ScaledObject
metadata:
  name: vllm
  namespace: finrag-llm
spec:
  scaleTargetRef:
    name: vllm
  minReplicaCount: 1
  maxReplicaCount: 3
  pollingInterval: 5
  cooldownPeriod: 60
  advanced:
    horizontalPodAutoscalerConfig:
      behavior:
        scaleDown:
          stabilizationWindowSeconds: 60
  triggers:
    - type: prometheus
      metadata:
        serverAddress: http://prometheus.finrag-llm.svc.cluster.local:9090
        query: sum(vllm:num_requests_waiting) + sum(vllm:num_requests_running) or vector(0)
        threshold: "4"
