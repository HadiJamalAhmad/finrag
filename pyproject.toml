[project]
name = "finrag"
version = "0.1.0"
description = "RAG over SEC filings (10-K / 10-Q) with citations, refusals and an evaluation bench"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    # Qdrant in local (embedded) mode: no server needed for the first weeks.
    "qdrant-client>=1.12,<2",
    # bge-small-en-v1.5 through ONNX: same model as RAG Wikipedia, without torch.
    # Imported lazily so the tests never load it.
    "fastembed>=0.4",
    "fastapi>=0.111",
    "uvicorn>=0.30",
    "langgraph>=0.2",
    "langfuse>=5.2.0,<6",
    "strawberry-graphql[fastapi]>=0.341,<0.342",
    "pyjwt[crypto]>=2.15,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]
# Deploy the backend to Modal: deploy/modal_app.py
deploy = ["modal>=1.6"]
# Names in questions (FINRAG_PII=full): spaCy's small French model, pinned by its release.
pii = [
    "spacy>=3.8,<3.9",
    "fr-core-news-sm @ https://github.com/explosion/spacy-models/releases/download/fr_core_news_sm-3.8.0/fr_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.scripts]
finrag = "finrag.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true  # the spaCy model is published as a release wheel only

[tool.hatch.build.targets.wheel]
packages = ["src/finrag"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
