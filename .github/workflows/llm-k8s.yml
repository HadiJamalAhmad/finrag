# A sovereign LLM on Kubernetes, proven on a free runner (deploy/k8s/vllm/run.sh):
#   open weights at a pinned revision, SHA-256 checked inside the cluster;
#   vLLM with NO network egress, which still answers; a control pod that can reach the
#   Internet (so the block is the NetworkPolicy, not the runner);
#   KEDA scaling vLLM from 1 to 3 replicas on its own queue, read by Prometheus;
#   an in-cluster load test with no failed request; then a scan and an SBOM of the image.
# Report: eval/reports/k8s-vllm.json (artifact). CPU inference, hence a small model.
name: llm-k8s

on:
  push:
    paths:
      - deploy/k8s/vllm/**
      - .github/workflows/llm-k8s.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llm-k8s-${{ github.ref }}
  cancel-in-progress: true

env:
  REVISION: 7ae557604adf67be50417f59c2c2f167def9a775
  VLLM_IMAGE: vllm/vllm-openai-cpu:v0.34.0-x86_64@sha256:b14c3a46a4b08852b32528643e070d57f3731cccb0fa33ef86d4f3b3f8ac36c4

jobs:
  llm-k8s:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Room for the images (the runner's unused SDKs)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h / | tail -1
          grep -m1 'model name' /proc/cpuinfo; nproc; free -g | head -2
          grep -o -m1 -w -e avx512f -e avx2 /proc/cpuinfo | sort -u
      - name: Weights at the pinned revision, checksums verified
        run: |
          mkdir -p models/qwen && cd models/qwen
          for f in $(awk '{print $2}' ../../deploy/k8s/vllm/weights.lock); do
            curl -sfL --retry 3 -o "$f" \
              "https://huggingface.co/Qwen/Qwen2.5-0.5B-Instruct/resolve/$REVISION/$f"
          done
          sha256sum -c ../../deploy/k8s/vllm/weights.lock
      - uses: helm/kind-action@v1.12.0
        with:
          cluster_name: llm
          node_image: kindest/node:v1.32.2
          version: v0.27.0
      - name: The proof (deploy/k8s/vllm/run.sh)
        run: WEIGHTS=$PWD/models/qwen CONTEXT=kind-llm deploy/k8s/vllm/run.sh
      - if: failure()
        run: |
          kubectl -n finrag-llm get all,pvc,scaledobject,hpa || true
          kubectl -n finrag-llm describe pods | tail -120 || true
          # The first error, not the traceback that repeats it: earliest lines first.
          kubectl -n finrag-llm logs deploy/vllm --previous 2>/dev/null \
            | grep -v 'core.py:1757' | head -200 || true
      - name: Free the cluster's disk before the scan
        if: always()
        run: kind delete cluster --name llm
      # Reported, not failed: the image is upstream's; the counts go into the report.
      - name: Scan the vLLM image and write its SBOM (Trivy)
        if: always()
        run: |
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.58.1 image --quiet --scanners vuln \
            --severity HIGH,CRITICAL --format json -o /out/trivy.json "$VLLM_IMAGE"
          docker run --rm -v "$PWD:/out" aquasec/trivy:0.58.1 image --quiet \
            --format cyclonedx -o /out/sbom-vllm.cdx.json "$VLLM_IMAGE"
          python3 - <<'EOF'
          import json, pathlib
          t = json.load(open("trivy.json"))
          vulns = [v for r in t.get("Results", []) for v in r.get("Vulnerabilities") or []]
          scan = {s: {"total": sum(v["Severity"] == s for v in vulns),
                      "with_fix": sum(v["Severity"] == s and bool(v.get("FixedVersion"))
                                      for v in vulns)} for s in ("CRITICAL", "HIGH")}
          scan["sbom_components"] = len(json.load(open("sbom-vllm.cdx.json")).get("components", []))
          p = pathlib.Path("eval/reports/k8s-vllm.json")
          if p.exists():
              r = json.loads(p.read_text()); r["image_scan"] = scan
              p.write_text(json.dumps(r, indent=2, ensure_ascii=False) + "\n")
          print(json.dumps(scan))
          EOF
      - name: Summary
        if: always()
        run: |
          { echo '## LLM souverain sur Kubernetes'; echo '```';
            python3 -c "import json;r=json.load(open('eval/reports/k8s-vllm.json'));print('\n'.join(('PASS ' if v else 'FAIL ')+k for k,v in r['checks'].items()));print(json.dumps(r['load'] | {'throughput_by_30s': '...'}));print(json.dumps({k: v for k, v in r['autoscaling'].items() if k != 'timeline'}));print(json.dumps(r.get('image_scan')))" || true
            echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: k8s-vllm-report
          path: |
            eval/reports/k8s-vllm.json
            sbom-vllm.cdx.json
            trivy.json
